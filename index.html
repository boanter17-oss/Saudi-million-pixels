<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة المليون بكسل السعودية</title>
    <style>
        /* الألوان الأساسية والتنسيق العام */
        :root {
            --navy-blue: #0A192F;
            --gold: #D4AF37;
            --dark-gold: #AA8C2C;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--navy-blue);
            color: var(--gold);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }

        header {
            padding: 20px;
            border-bottom: 2px solid var(--gold);
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 1.2rem;
            margin-top: 10px;
            color: #fff;
        }

        /* تخطيط الصفحة الرئيسي */
        .main-layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            padding: 0 20px;
            overflow-x: auto; /* للسماح بالتمرير في الشاشات الصغيرة */
        }

        /* المساحات الجانبية (السدو والزخارف الجصية) */
        .side-pattern {
            width: 150px;
            height: 1000px;
            border: 2px solid var(--gold);
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl;
            font-size: 1.5rem;
            letter-spacing: 5px;
            background-size: cover;
            background-position: center;
        }

        /* ضع مسار صورة السدو هنا مستقبلاً */
        .sadu-right {
            /* background-image: url('sadu-pattern.png'); */
        }

        /* ضع مسار صورة الزخارف الأحسائية هنا مستقبلاً */
        .ahsa-left {
            /* background-image: url('ahsa-pattern.png'); */
        }

        /* شبكة المليون بكسل */
        .pixel-grid-container {
            width: 1000px;
            height: 1000px;
            background-color: #ffffff;
            position: relative; /* ضروري لتموضع الإعلانات داخله */
            border: 3px solid var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            /* رسم شبكة وهمية للتوضيح (كل مربع 10x10 بكسل) */
            background-image: 
                linear-gradient(to right, #f0f0f0 1px, transparent 1px),
                linear-gradient(to bottom, #f0f0f0 1px, transparent 1px);
            background-size: 10px 10px;
        }

        /* تنسيق الإعلانات (البلوكات) */
        .ad-block {
            position: absolute;
            display: block;
            text-decoration: none;
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.1);
            transition: transform 0.2s, z-index 0.2s;
        }

        .ad-block:hover {
            transform: scale(1.1);
            z-index: 10;
            border: 1px solid var(--gold);
            box-shadow: 0 0 10px var(--gold);
        }

        /* زر الحجز */
        .cta-button {
            display: inline-block;
            margin: 30px 0;
            padding: 15px 40px;
            background-color: var(--gold);
            color: var(--navy-blue);
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .cta-button:hover {
            background-color: var(--dark-gold);
        }

    </style>
</head>
<body>

    <header>
        <h1>صفحة المليون بكسل السعودية</h1>
        <div class="subtitle">المساحة الإعلانية الأبرز للشركات والمتاجر | امتلك بكسلاتك الآن</div>
    </header>

    <div class="main-layout">
        <!-- الجانب الأيمن: نقوش السدو -->
        <aside class="side-pattern sadu-right">
            مساحة نقوش السدو
        </aside>

        <!-- الوسط: مساحة المليون بكسل -->
        <main class="pixel-grid-container">
            
            <!-- 
                أمثلة لإضافة إعلانات العملاء يدوياً بعد التحويل:
                كل 10 بكسل = 1 بلوك
                يتم تحديد الموقع عبر (right) و (top) 
            -->

            <!-- مثال 1: عميل اشترى مساحة 100x100 بكسل (100 بلوك = 10,000 ريال) في الزاوية العلوية اليمنى -->
            <a href="https://example.com" class="ad-block" title="شركة العقارات الأولى"
               style="width: 100px; height: 100px; right: 0px; top: 0px; background-color: #333; background-image: url('logo1.jpg'); background-size: cover;">
            </a>

            <!-- مثال 2: عميل اشترى مساحة 50x50 بكسل في مكان آخر -->
            <a href="https://example2.com" class="ad-block" title="مشتل الأشجار"
               style="width: 50px; height: 50px; right: 200px; top: 150px; background-color: #28a745; background-image: url('logo2.jpg'); background-size: cover;">
            </a>

        </main>

        <!-- الجانب الأيسر: الزخارف الجصية -->
        <aside class="side-pattern ahsa-left">
            مساحة الزخارف الأحسائية
        </aside>
    </div>

    <!-- زر التواصل المباشر للحجز -->
    <a href="https://wa.me/966599156610?text=أهلاً،%20أرغب%20بحجز%20مساحة%20إعلانية%20في%20صفحة%20المليون%20بكسل" target="_blank" class="cta-button">
        احجز مساحتك الآن عبر الواتساب
    </a>

</body>
</html>
